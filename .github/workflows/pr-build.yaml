name: PR Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # there's no much tests for now. Most of the time job runs in less than 1 minute
    timeout-minutes: 5

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c debug /p:TreatWarningsAsErrors=true

      - name: Test
        run: |
          dotnet test -c debug \
            --results-directory artifacts/tests \
            --coverage \
            --coverage-output-format cobertura \
            --coverage-output coverage.cobertura.xml

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/tests
